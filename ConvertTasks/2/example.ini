; Конфигурация сервера

app_name = "Dungeon"
debug = no

[server]
host = 0.0.0.0
port = 8080
workers = 8
timeout = 12.5
banner = "Добро пожаловать, ; это не комментарий"

[database]
url = postgres://localhost:5432/dungeon
pool_size = 16
ssl = on
password = ""

[limits]
max_players = 250
tick_rate = 30
idle_kick = null

[logging]
level = DEBUG        # комментарий
file = logs/server.log
rotate = yes
version = 007
